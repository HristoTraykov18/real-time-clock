; Template of rtc_secrets.ini. Copy it to rtc_secrets.ini (ignored by git) and set your own values.
; rtc_setup writes them into the compile copy of include/Globals.h; the repository keeps placeholders.
; Values must be printable ASCII without quotes (") or backslashes.

[secrets]
; Wi-Fi password of the clock's access point, used when "Edit Clock ID" is ticked (8 to 63 characters)
ap_password = ChangeMe1234

; Login of the software update page (port 1394, /sourceControl)
ota_user = admin
ota_password = ChangeMe1234

[platformio]
default_envs =
    esp32
    esp8266

; Build environments for a module selection. rtc_setup writes rtc_build.ini into the compile copy
; (Real_Time_Clock_Compile) for every build; see "Building without the launcher" in README.md for
; writing one by hand. A missing file is ignored
extra_configs = rtc_build*.ini

; ----------------------------------------------------------------------
; GLOBAL CONFIGURATION
; ----------------------------------------------------------------------
[env]
framework = arduino

; Use LittleFS as the filesystem type
board_build.filesystem = littlefs

; Serial Monitor options
monitor_speed   = 115200
monitor_filters = default

check_tool  = cppcheck
check_flags = cppcheck: --enable=warning,style,performance --inline-suppr --std=c++17
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<include/>

; Default libraries
; RTClib and DallasTemperature are vendored (trimmed) in lib/, so only their own
; dependencies are pulled from the registry.
lib_deps = adafruit/Adafruit BusIO @ ^1.14.1 ; Required by the vendored RTClib

; The vendored DallasTemperature is only needed by the Temperature module builds
lib_ignore = DallasTemperature


[diagnostics]
build_flags =
    -Wall
    -Wextra
    -Wdouble-promotion
    -Werror=return-type
    -Werror=uninitialized
    -Werror=implicit-fallthrough
    -Werror=format
    -Werror=write-strings
    -Werror=sign-compare


; ----------------------------------------------------------------------
; SOURCE FILTERS
; ----------------------------------------------------------------------
; Module sources are excluded here and added back by the module sections below
[filters]
esp32   = +<*> -<esp8266/> -<BrightnessModule.cpp> -<GPSModule.cpp> -<TemperatureModule.cpp> -<esp32/Audio*.cpp>
esp8266 = +<*> -<esp32/> -<BrightnessModule.cpp> -<GPSModule.cpp> -<TemperatureModule.cpp>


; ----------------------------------------------------------------------
; PLATFORM SPECIFIC CONFIGURATION
; ----------------------------------------------------------------------
[esp32_base]
platform        = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board           = esp32dev
board_build.partitions = default.csv ; Carries the data partition LittleFS is built into
upload_speed    = 921600
build_flags     = -D PLATFORM_ESP32 -Iinclude/esp32
build_src_flags = ${diagnostics.build_flags}
monitor_filters =
    esp32_exception_decoder
    ${env.monitor_filters}

lib_deps        =
    ${env.lib_deps}
    WiFi                    ; WiFi.h and WiFiUdp.h
    WebServer
    HTTPUpdateServer
    Update


[esp8266_base]
platform        = platformio/espressif8266 @ 4.2.1 ; Arduino core 3.1.2 (framework-arduinoespressif8266 3.30102.0)
board           = nodemcuv2
upload_speed    = 256000
build_flags     = -D PLATFORM_ESP8266 -Iinclude/esp8266
build_src_flags = ${diagnostics.build_flags}
monitor_filters =
    esp8266_exception_decoder
    ${env.monitor_filters}

lib_deps        =
    ${env.lib_deps}
    ESP8266WiFi             ; ESP8266WiFi.h and WiFiUdp.h
    ESP8266WebServer
    ESP8266HTTPUpdateServer
    EspSoftwareSerial       ; SoftwareSerial.h, only reached by the GPS builds


; ----------------------------------------------------------------------
; MODULES SPECIFIC CONFIGURATION
; ----------------------------------------------------------------------
[brightness_module]
build_flags    = -D BRIGHTNESS_MODULE
lib_deps       =
src_filter     = +<BrightnessModule.cpp>
lib_ignore_off =


[gps_module]
build_flags    = -D GPS_MODULE
lib_deps       = mikalhart/TinyGPSPlus @ 1.0.3
src_filter     = +<GPSModule.cpp>
lib_ignore_off =


[temperature_module]
build_flags    = -D TEMPERATURE_MODULE
lib_deps       = paulstoffregen/OneWire @ ^2.3.8 ; Required by the vendored DallasTemperature
src_filter     = +<TemperatureModule.cpp>
lib_ignore_off = DallasTemperature


; ESP32 only
[audio_module_base]
build_flags    = -D AUDIO_MODULE_BASE
lib_deps       =
src_filter     = +<esp32/AudioModule.cpp> +<esp32/AudioPlayerDfPlayer.cpp>
lib_ignore_off =


[audio_module_extended]
build_flags    = -D AUDIO_MODULE_EXTENDED
lib_deps       = ; The VS1053 driver is added with the extended implementation
src_filter     = +<esp32/AudioModule.cpp> +<esp32/AudioPlayerVs1053.cpp> +<esp32/AudioFiles.cpp>
lib_ignore_off =


; ----------------------------------------------------------------------
; BUILD TARGETS
; ----------------------------------------------------------------------
; The plain platform builds, without modules. Builds with modules extend these (see extra_configs)

[env:esp32]
extends          = esp32_base
build_src_filter = ${filters.esp32}


[env:esp8266]
extends          = esp8266_base
build_src_filter = ${filters.esp8266}

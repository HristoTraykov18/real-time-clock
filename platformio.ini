[platformio]
default_envs = 
    esp8266_only
    esp8266_brightness_only
    esp8266_temp_only
    esp8266_temp_brightness
    esp8266_gps_only
    esp8266_gps_temp
    esp8266_gps_brightness
    esp8266_gps_temp_brightness

; ----------------------------------------------------------------------
; GLOBAL CONFIGURATION
; ----------------------------------------------------------------------
[env]
framework = arduino

; Use LittleFS as the filesystem type
board_build.filesystem = littlefs

; Serial Monitor options
upload_speed    = 256000
monitor_speed   = 115200
monitor_filters = default

; Default libraries
; RTClib and DallasTemperature are vendored (trimmed) in lib/, so only their own
; dependencies are pulled from the registry.
lib_deps = adafruit/Adafruit BusIO @ ^1.14.1 ; Required by the vendored RTClib

; The vendored DallasTemperature is only needed by the Temperature module builds
lib_ignore = DallasTemperature


; ----------------------------------------------------------------------
; PLATFORM SPECIFIC CONFIGURATION
; ----------------------------------------------------------------------
[esp32_base]
platform        = espressif32
board           = esp32dev
build_flags     = -D PLATFORM_ESP32
monitor_filters =
    esp32_exception_decoder
    ${env.monitor_filters}

lib_deps        = ${env.lib_deps} ; May not work


[esp8266_base]
platform        = espressif8266
board           = nodemcuv2
build_flags     = -D PLATFORM_ESP8266
monitor_filters =
    esp8266_exception_decoder
    ${env.monitor_filters}

lib_deps        = ${env.lib_deps}


; ----------------------------------------------------------------------
; MODULES SPECIFIC CONFIGURATION
; ----------------------------------------------------------------------
[gps_module]
build_flags = -D GPS_MODULE
lib_deps    = mikalhart/TinyGPSPlus @ 1.0.2


[brightness_module]
build_flags = -D BRIGHTNESS_MODULE


[temperature_module]
build_flags = -D TEMPERATURE_MODULE
lib_deps    = paulstoffregen/OneWire @ ^2.3.8 ; Required by the vendored DallasTemperature

; ----------------------------------------------------------------------
; BUILD TARGETS
; ----------------------------------------------------------------------


; --- TARGET 1.2: ESP8266 with no modules ---
[env:esp8266_only]
extends     = esp8266_base
build_src_filter = +<*> -<GPSModule.cpp> -<BrightnessModule.cpp> -<TemperatureModule.cpp>


; --- TARGET 2.2: ESP8266 with Temperature module ---
[env:esp8266_temp_only]
extends     = esp8266_base
build_flags =
    ${esp8266_base.build_flags}
    ${temperature_module.build_flags}
lib_deps    =
    ${env.lib_deps}
    ${temperature_module.lib_deps}
lib_ignore   = ; Compile the vendored DallasTemperature for this target
build_src_filter = +<*> -<GPSModule.cpp> -<BrightnessModule.cpp>


; --- TARGET 3.2: ESP8266 with Brightness module ---
[env:esp8266_brightness_only]
extends     = esp8266_base
build_flags =
    ${esp8266_base.build_flags}
    ${brightness_module.build_flags}
build_src_filter = +<*> -<GPSModule.cpp> -<TemperatureModule.cpp>


; --- TARGET 4.2: ESP8266 with Temperature and Brightness modules ---
[env:esp8266_temp_brightness]
extends     = esp8266_base
build_flags =
    ${esp8266_base.build_flags}
    ${temperature_module.build_flags}
    ${brightness_module.build_flags}
lib_deps    =
    ${env.lib_deps}
    ${temperature_module.lib_deps}
lib_ignore   = ; Compile the vendored DallasTemperature for this target
build_src_filter = +<*> -<GPSModule.cpp>


; --- TARGET 5.2: ESP8266 with GPS module ---
[env:esp8266_gps_only]
extends     = esp8266_base
build_flags =
    ${esp8266_base.build_flags}
    ${gps_module.build_flags}
lib_deps    = 
    ${env.lib_deps}
    ${gps_module.lib_deps}
build_src_filter = +<*> -<BrightnessModule.cpp> -<TemperatureModule.cpp>


; --- TARGET 6.2: ESP8266 with GPS and Temperature modules ---
[env:esp8266_gps_temp]
platform        = espressif8266
board           = nodemcuv2
monitor_filters =
    esp8266_exception_decoder
    ${env.monitor_filters}
build_flags     =
    -D PLATFORM_ESP8266
    ${gps_module.build_flags}
    ${temperature_module.build_flags}
lib_deps        =
    ${env.lib_deps}
    ${gps_module.lib_deps}
    ${temperature_module.lib_deps}
lib_ignore   = ; Compile the vendored DallasTemperature for this target
build_src_filter = +<*> -<BrightessModule.cpp>


; --- TARGET 7.2: ESP8266 with GPS and Brightness modules ---
[env:esp8266_gps_brightness]
platform        = espressif8266
board           = nodemcuv2
monitor_filters =
    esp8266_exception_decoder
    ${env.monitor_filters}
build_flags     =
    -D PLATFORM_ESP8266
    ${gps_module.build_flags}
    ${brightness_module.build_flags}
lib_deps        =
    ${env.lib_deps}
    ${gps_module.lib_deps}
build_src_filter = +<*> -<TemperatureModule.cpp>


; --- TARGET 8.2: ESP8266 with GPS, Temperature, and Brightness modules ---
[env:esp8266_gps_temp_brightness]
platform        = espressif8266
board           = nodemcuv2
monitor_filters =
    esp8266_exception_decoder
    ${env.monitor_filters}
build_flags     =
    -D PLATFORM_ESP8266
    ${gps_module.build_flags}
    ${temperature_module.build_flags}
    ${brightness_module.build_flags}
lib_deps        =
    ${env.lib_deps}
    ${gps_module.lib_deps}
    ${temperature_module.lib_deps}
lib_ignore  = ; Compile the vendored DallasTemperature for this target

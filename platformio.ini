    ${gps_module.lib_deps}
build_src_filter = ${filters.esp32} -<TemperatureModule.cpp>


; --- TARGET 1.8: ESP32 with GPS, Temperature, and Brightness modules ---
[env:esp32_gps_temp_bright]
extends         = esp32_base
build_flags     =
    ${esp32_base.build_flags}

    ${temperature_module.lib_deps}
lib_ignore   = ; Compile the vendored DallasTemperature for this target
build_src_filter = ${filters.esp8266} -<GPSModule.cpp> -<BrightnessModule.cpp>


; --- TARGET 2.3: ESP8266 with Brightness module ---

[platformio]
default_envs = 
    esp32_only
    esp8266_only

; ----------------------------------------------------------------------
; GLOBAL CONFIGURATION
; ----------------------------------------------------------------------
[env]
framework = arduino

; Use LittleFS as the filesystem type
board_build.filesystem = littlefs

; Serial Monitor options
monitor_speed   = 115200
monitor_filters = default

check_tool  = cppcheck
check_flags = cppcheck: --enable=warning,style,performance --inline-suppr --std=c++17
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<include/>

; Default libraries
; RTClib and DallasTemperature are vendored (trimmed) in lib/, so only their own
; dependencies are pulled from the registry.
lib_deps = adafruit/Adafruit BusIO @ ^1.14.1 ; Required by the vendored RTClib

; The vendored DallasTemperature is only needed by the Temperature module builds
lib_ignore = DallasTemperature


[diagnostics]
build_flags =
    -Wall
    -Wextra
    -Wdouble-promotion
    -Werror=return-type
    -Werror=uninitialized
    -Werror=implicit-fallthrough
    -Werror=format
    -Werror=write-strings
    -Werror=sign-compare


; ----------------------------------------------------------------------
; SOURCE FILTERS
; ----------------------------------------------------------------------
[filters]
esp32   = +<*> -<esp8266/>
esp8266 = +<*> -<esp32/>


; ----------------------------------------------------------------------
; PLATFORM SPECIFIC CONFIGURATION
; ----------------------------------------------------------------------
[esp32_base]
platform        = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board           = esp32dev
board_build.partitions = default.csv ; Carries the data partition LittleFS is built into
upload_speed    = 921600
build_flags     = -D PLATFORM_ESP32 -Iinclude/esp32
build_src_flags = ${diagnostics.build_flags}
monitor_filters =
    esp32_exception_decoder
    ${env.monitor_filters}

lib_deps        =
    ${env.lib_deps}
    WiFi                    ; WiFi.h and WiFiUdp.h
    WebServer


[esp8266_base]
platform        = espressif8266
board           = nodemcuv2
upload_speed    = 256000
build_flags     = -D PLATFORM_ESP8266 -Iinclude/esp8266
build_src_flags = ${diagnostics.build_flags}
monitor_filters =
    esp8266_exception_decoder
    ${env.monitor_filters}

lib_deps        =
    ${env.lib_deps}
    ESP8266WiFi             ; ESP8266WiFi.h and WiFiUdp.h
    ESP8266WebServer
    ESP8266HTTPUpdateServer
    EspSoftwareSerial       ; SoftwareSerial.h, only reached by the GPS builds


; ----------------------------------------------------------------------
; MODULES SPECIFIC CONFIGURATION
; ----------------------------------------------------------------------
[gps_module]
build_flags = -D GPS_MODULE
lib_deps    = mikalhart/TinyGPSPlus @ 1.0.3


[brightness_module]
build_flags = -D BRIGHTNESS_MODULE


[temperature_module]
build_flags = -D TEMPERATURE_MODULE
lib_deps    = paulstoffregen/OneWire @ ^2.3.8 ; Required by the vendored DallasTemperature

; ----------------------------------------------------------------------
; BUILD TARGETS
; ----------------------------------------------------------------------


; --- TARGET 1.1: ESP32 with no modules ---
[env:esp32_only]
extends     = esp32_base
build_src_filter = ${filters.esp32} -<GPSModule.cpp> -<BrightnessModule.cpp> -<TemperatureModule.cpp>


; --- TARGET 1.2: ESP32 with Temperature module ---
[env:esp32_temp]
extends     = esp32_base
build_flags =
    ${esp32_base.build_flags}
    ${temperature_module.build_flags}
lib_deps    =
    ${esp32_base.lib_deps}
    ${temperature_module.lib_deps}
lib_ignore   = ; Compile the vendored DallasTemperature for this target
build_src_filter = ${filters.esp32} -<GPSModule.cpp> -<BrightnessModule.cpp>


; --- TARGET 1.3: ESP32 with Brightness module ---
[env:esp32_bright]
extends     = esp32_base
build_flags =
    ${esp32_base.build_flags}
    ${brightness_module.build_flags}
build_src_filter = ${filters.esp32} -<GPSModule.cpp> -<TemperatureModule.cpp>


; --- TARGET 1.4: ESP32 with Temperature and Brightness modules ---
[env:esp32_temp_bright]
extends     = esp32_base
build_flags =
    ${esp32_base.build_flags}
    ${temperature_module.build_flags}
    ${brightness_module.build_flags}
lib_deps    =
    ${esp32_base.lib_deps}
    ${temperature_module.lib_deps}
lib_ignore   = ; Compile the vendored DallasTemperature for this target
build_src_filter = ${filters.esp32} -<GPSModule.cpp>


; --- TARGET 1.5: ESP32 with GPS module ---
[env:esp32_gps]
extends     = esp32_base
build_flags =
    ${esp32_base.build_flags}
    ${gps_module.build_flags}
lib_deps    =
    ${esp32_base.lib_deps}
    ${gps_module.lib_deps}
build_src_filter = ${filters.esp32} -<BrightnessModule.cpp> -<TemperatureModule.cpp>


; --- TARGET 1.6: ESP32 with GPS and Temperature modules ---
[env:esp32_gps_temp]
extends         = esp32_base
build_flags     =
    ${esp32_base.build_flags}
    ${gps_module.build_flags}
    ${temperature_module.build_flags}
lib_deps        =
    ${esp32_base.lib_deps}
    ${gps_module.lib_deps}
    ${temperature_module.lib_deps}
lib_ignore   = ; Compile the vendored DallasTemperature for this target
build_src_filter = ${filters.esp32} -<BrightnessModule.cpp>


; --- TARGET 1.7: ESP32 with GPS and Brightness modules ---
[env:esp32_gps_bright]
extends         = esp32_base
build_flags     =
